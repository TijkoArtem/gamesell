<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Оплата заказа · FastSell</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="payment-card">
    <h1>Сканируйте QR‑код для оплаты.<br>Не забудьте указать что Вы оплачиваете и в каком количестве в поле «Сообщение получателю».</h1>

    <div class="qr-wrapper">
      <img src="Снимок экрана 2026-10-05 193600.png" alt="QR-код для оплаты">
    </div>

    <h2>ИЛИ ОПЛАТИТЕ ПО КНОПКЕ НИЖЕ</h2>

    <div class="button-container">
      <a href="https://www.tbank-online.com/rm/r_xFvBgcmvdO.ihWMfbBhUp/domdI12130" target="_blank" rel="noopener noreferrer">
        <button class="btn-pay">Оплатить</button>
      </a>
    </div>
  </div>








<p id="copyText" style="cursor: pointer;">Или: 2200 7012 2259 6725 (копировать)</p>
<span id="message" style="margin-left: 10px; color: green; display: none;">Скопировано!</span>

<script>
  document.getElementById('copyText').addEventListener('click', function() {
    const textToCopy = this.innerText;

    navigator.clipboard.writeText(textToCopy).then(() => {
      const msg = document.getElementById('message');
      msg.style.display = 'inline';
      setTimeout(() => {
        msg.style.display = 'none';
      }, 2000);
    }).catch(err => {
      console.error('Ошибка копирования: ', err);
    });
  });
</script>













</body>
</html>
